<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Step by Step</title><style>

ing:18px}legend{font-weight:650;padding:0 6px}fieldset label{background:var(--soft);padding:10px;border-radius:8px;cursor:pointer}input[type=radio]{margin-right:10px;accent-color:var(--accent)}progress{width:100%;height:14px;accent-color:var(--accent)}.badge{display:inline-block;font-size:14px;background:var(--soft);padding:4px 10px;border-radius:20px}.feedback{padding:12px;border-left:4px solid var(--accent);background:var(--soft);margin-top:12px}.feedback:empty{display:none}[hidden]{display:none!important}@media(max-width:600px){main{padding:14px}.card{padding:18px}header{align-items:flex-start}button{font-size:16px}}

</style></head><body><main><header><button class="secondary" id="back" type="button" aria-label="Go back to previous app screen" hidden>← Back</button><div><p class="muted">LEARN A LITTLE. PRACTISE. KEEP GOING.</p><h1>Python Step by Step</h1></div><button class="secondary" id="theme" aria-pressed="false">Dark theme</button><label class="colour-control" for="screenColour">Screen colour<select id="screenColour"><option value="green">Green</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="grey">Grey</option></select></label></header><div class="course-layout"><aside class="sidebar" aria-label="Python lesson topics"><h2>PYTHON TUTORIAL</h2><nav id="topics" aria-label="Sections and lessons"></nav></aside><div class="content"><p>Start from scratch and build your confidence, one short lesson at a time.</p><div class="card course-progress"><strong id="progressLabel"></strong><progress id="progress" max="100" value="0" aria-label="Course progress"></progress><p class="muted" id="storageNote">Progress is saved in this browser on this device. It does not sync to another device.</p><div class="actions"><button id="continue">Continue learning</button></div></div><div class="card lesson-picker"><label for="lessonSelect">Choose a lesson</label><select id="lessonSelect"><option value="">Select a lesson…</option></select></div><section id="screen" aria-label="Learning content"></section><footer class="card"><a class="donation" href="https://www.paypal.me/msimmonite" target="_blank" rel="noopener noreferrer">Support this app with PayPal</a><div class="actions"><button class="secondary" id="export">Back up progress</button><label style="margin:0"><span class="badge">Restore progress</span><input id="import" type="file" accept=".json" aria-label="Restore saved progress"></label><button class="secondary" id="reset">Reset progress</button></div><p id="notice" role="status" aria-live="polite"></p></footer></div></div></main><script>
'use strict';
const sections=[
{title:'1. Your first Python code',lessons:[
{title:'Make Python say Hello',explain:'Python is a programming language: a way to give a computer instructions. print() displays something on the screen. Put text inside quotation marks.',code:'print("Hello, Mike!")',output:'Hello, Mike!',task:'What appears on the screen when this code runs?',answer:'Hello, Mike!',hint:'The quotation marks tell Python this is text. They do not appear in the output.'},
{title:'Text and numbers',explain:'Text in quotes is called a string. Numbers can be used in calculations. Python uses + to add, - to subtract, * to multiply, and / to divide.',code:'print(3 + 4)\nprint("3 + 4")',output:'7\n3 + 4',task:'What does print(6 * 3) display?',answer:'18',hint:'The asterisk means multiply.'}],quiz:[['What does print() do?',['Displays output','Saves a file','Repeats a loop'],0,'print() displays text or values.'],['Which is a string?',['42','"Hello"','3 + 4'],1,'Quotation marks make Hello a string.'],['What does print(10 - 4) show?',['14','10 - 4','6'],2,'Python subtracts four from ten.']]},
{title:'2. Variables and input',lessons:[
{title:'Remember a value',explain:'A variable is a name for a value. The equals sign assigns a value to that name. Python treats uppercase and lowercase letters as different.',code:'name = "Mike"\nage = 61\nprint(name)',output:'Mike',task:'Write one line that assigns the number 10 to a variable named score.',answer:'score = 10',kind:'code',hint:'Use the variable name, an equals sign, and the number.'},
{title:'Ask the user a question',explain:'input() asks the user to type an answer. It returns text, even if the user types digits. int() converts suitable text into a whole number.',code:'age = int(input("How old are you? "))\nprint(age + 1)',output:'If the user types 20, the final output is 21.',task:'If the user types 30, what number does the last line display?',answer:'31',hint:'int() converts "30" to the number 30, then the code adds 1.'}],quiz:[['What does x = 5 do?',['Assigns 5 to x','Checks whether x equals 5','Prints x'],0,'A single equals sign assigns a value.'],['What type does input() return?',['A whole number','Text (a string)','A list'],1,'Use int() or float() when you need a numeric value.'],['Which converts "12" to a whole number?',['print("12")','str("12")','int("12")'],2,'int() converts suitable text to an integer.']]},
{title:'3. Decisions',lessons:[
{title:'Use if and else',explain:'An if statement runs code when a condition is true. else provides another path. The colon and indentation matter. Use four spaces for the indented lines.',code:'score = 8\nif score >= 5:\n    print("Passed")\nelse:\n    print("Try again")',output:'Passed',task:'If score is changed to 3, what message appears?',answer:'Try again',hint:'3 is below 5, so the else branch runs.'},
{title:'Compare values',explain:'== checks equality. != means not equal. > means greater than and < means less than. >= and <= include equality.',code:'print(5 == 5)\nprint(5 > 8)',output:'True\nFalse',task:'What does print(7 >= 7) display?',answer:'True',hint:'Greater than or equal includes the case where both values are equal.'}],quiz:[['Which checks equality?',['=','==','!='],1,'== compares; = assigns.'],['What does else do?',['Runs when the if condition is false','Always runs first','Repeats the code'],0,'else handles the other case.'],['Why indent the body of an if statement?',['For decoration only','To create a variable','To show which code belongs inside it'],2,'Indentation is part of Python syntax.']]},
{title:'4. Loops and lists',lessons:[
{title:'Repeat with a loop',explain:'A for loop repeats code for each item. range(3) produces 0, 1, and 2. The stopping number is not included.',code:'for number in range(3):\n    print(number)',output:'0\n1\n2',task:'How many times does the loop run?',answer:'3',hint:'Count the values 0, 1, and 2.'},
{title:'Store several values',explain:'A list holds several items. Square brackets create a list. Positions, called indexes, start at zero.',code:'tools = ["hammer", "saw", "drill"]\nprint(tools[1])',output:'saw',task:'What does print(tools[0]) display?',answer:'hammer',hint:'Index zero selects the first item.'}],quiz:[['What values does range(2) produce?',['1 and 2','0 and 1','0, 1, and 2'],1,'The stop value 2 is excluded.'],['What is the first list index?',['0','1','-2'],0,'Python lists start at index zero.'],['What does items.append("book") do?',['Removes book','Sorts items','Adds book at the end'],2,'append() adds one item to the end of a list.']]},
{title:'5. Functions and errors',lessons:[
{title:'Reuse code with a function',explain:'A function groups instructions under a name. def defines it. Parameters receive input values. return sends a result back to the caller.',code:'def double(number):\n    return number * 2\n\nprint(double(4))',output:'8',task:'What does double(6) return?',answer:'12',hint:'The function multiplies its input by two.'},
{title:'Find and fix errors',explain:'An error message helps explain what went wrong. A NameError often means a name is undefined. A SyntaxError means Python cannot understand the code structure. Read the error and the indicated line.',code:'name = "Mike"\nprint(nmae)  # misspelled variable',output:'NameError: nmae is not defined (wording may vary).',task:'Write the corrected print line.',answer:'print(name)',kind:'code',hint:'Use the variable name exactly as it was defined.'}],quiz:[['Which keyword defines a function?',['return','def','for'],1,'def starts a function definition.'],['What does return do?',['Sends a result back','Prints every value','Creates a loop'],0,'A returned value can be stored or used by the caller.'],['Using an undefined variable usually causes what?',['A list','No error','NameError'],2,'Check spelling and whether the variable was assigned.']]},
{title:'6. Files and a small project',lessons:[
{title:'Read a text file',explain:'open() opens a file. The mode "r" means read. with closes the file when the block finishes. The file must exist at the path you specify.',code:'with open("notes.txt", "r", encoding="utf-8") as file:\n    notes = file.read()\nprint(notes)',output:'The text stored in notes.txt.',task:'Which mode means read: r or w?',answer:'r',hint:'r is for reading; w is for writing and can overwrite existing content.'},
{title:'Build a simple quote calculator',explain:'Combine input, number conversion, variables, and arithmetic. float() allows decimal numbers, which are useful for a beginner cost calculator.',code:'materials = float(input("Materials cost: "))\nlabour = float(input("Labour cost: "))\ntotal = materials + labour\nprint("Total:", total)',output:'For materials 10 and labour 20: Total: 30.0',task:'Materials cost 12.50 and labour costs 20. What is the total? Enter the number only.',answer:'32.5',kind:'number',hint:'Add the two costs. 32.50 and 32.5 are the same numeric value.'}],quiz:[['What does file.read() do?',['Deletes the file','Reads its contents','Writes new text'],1,'read() returns the file contents as text.'],['What does float("2.5") produce?',['The number 2.5','The number 2','A list'],0,'float() converts suitable text to a decimal-capable number.'],['What is a good next project?',['Skip practice','Only memorize keywords','Build a calculator and test its results'],2,'Small projects help you combine skills and find mistakes.']]}
];

const extraExercises=[[["What does print(\"Welcome\") display?", "Welcome", "Text inside the quotes is printed without the quotes."], ["What does print(\"Python is fun\") display?", "Python is fun", "Spaces inside a string are kept."], ["Write a line that prints Hello.", "print(\"Hello\")", "Call print() with the text in quotation marks.", "code"]], [["What does print(9 - 2) display?", "7", "Subtract two from nine."], ["What does print(5 * 4) display?", "20", "The asterisk means multiplication."], ["What does print(\"12\") display?", "12", "This prints the characters 1 and 2; the value being printed is a string."]], [["name = \"Sam\" followed by print(name) displays what?", "Sam", "print(name) uses the value assigned to name."], ["Write a line assigning 25 to age.", "age = 25", "Use a single equals sign to assign a value.", "code"], ["x = 4; x = x + 3; print(x). What is the output?", "7", "The second assignment replaces 4 with 4 + 3."]], [["What type does input() return? Enter string or integer.", "string", "input() always returns text."], ["What does int(\"8\") + 2 equal?", "10", "Convert the text to the integer 8, then add 2."], ["Write a line that converts \"15\" to a whole number and assigns it to age.", "age = int(\"15\")", "Put the text inside int(), then assign the result.", "code"]], [["With score = 5, does the example print Passed or Try again?", "Passed", "The condition uses >=, so five qualifies."], ["If temperature = 10, what does this print?\nif temperature < 0:\n    print(\"Cold\")\nelse:\n    print(\"Mild\")", "Mild", "Ten is not less than zero, so else runs."], ["Write the condition line that checks whether age is at least 18. Include the colon.", "if age >= 18:", "Use >= for at least, and end the if line with a colon.", "code"]], [["What does print(3 != 4) display?", "True", "Three is not equal to four."], ["What does print(2 > 8) display?", "False", "Two is smaller than eight."], ["What does print(6 == 6) display?", "True", "Both values are equal."]], [["How many times does for n in range(5) run?", "5", "range(5) produces five values: 0 through 4."], ["What is the last number in range(4)?", "3", "The stopping value 4 is excluded."], ["What does this display? Put each number on its own line.\nfor n in range(2):\n    print(n)", "0\n1", "The loop prints zero, then one.", "multiline"]], [["colours = [\"red\", \"blue\", \"green\"]. What is colours[2]?", "green", "The indexes are 0, 1, and 2."], ["What is len([10, 20, 30])?", "3", "len() counts the items in a list."], ["Write a line adding \"wrench\" to the end of tools.", "tools.append(\"wrench\")", "append() adds one item to the list.", "code"]], [["Using double() from the example, what is double(10)?", "20", "The function multiplies ten by two."], ["Write the function header for a function named greet with no parameters.", "def greet():", "def introduces the name; empty parentheses mean no parameters.", "code"], ["What does this print?\ndef add(a, b):\n    return a + b\nprint(add(2, 3))", "5", "The arguments 2 and 3 are added and returned."]], [["What error usually occurs when you use a variable that was never assigned?", "NameError", "Python cannot find a definition for the name."], ["Fix this line: print(\"Hello\"", "print(\"Hello\")", "The closing parenthesis was missing.", "code"], ["name = \"Mike\"; print(Name). Which variable name should replace Name?", "name", "Python names are case-sensitive."]], [["Which mode can overwrite a file: r or w?", "w", "Writing with w can replace existing file contents."], ["Write the line that reads all text from the variable file into notes.", "notes = file.read()", "read() returns the contents, which you assign to notes.", "code"], ["What statement automatically closes a file after its block? Enter with or if.", "with", "with manages the file and closes it when its block finishes."]], [["Materials cost 8 and labour costs 15. What is the total?", "23", "Add 8 and 15.", "number"], ["What is float(\"4.5\") + 1?", "5.5", "float() converts the string into a number before addition.", "number"], ["Write the line calculating total from materials and labour.", "total = materials + labour", "Add the two variables and assign the result.", "code"]]];
sections.forEach((section,i)=>section.lessons.forEach((item,j)=>{item.exercises=[{task:item.task,answer:item.answer,kind:item.kind,hint:item.hint,explanation:item.hint},...extraExercises[i*2+j].map(([task,answer,explanation,kind])=>({task,answer,explanation,kind,hint:explanation}))];}));
const exerciseDistractors=[[["Hello", "Hello, Mike"], ["welcome", "Nothing"], ["Pythonisfun", "Python"], ["print(Hello)", "\"Hello\""]], [["63", "9"], ["11", "2"], ["9", "54"], ["Nothing", "21"]], [["score == 10", "10 = score"], ["name", "Mike"], ["age == 25", "25 = age"], ["4", "3"]], [["301", "30"], ["integer", "boolean"], ["82", "8"], ["age = \"15\"", "age = input(\"15\")"]], [["Passed", "3"], ["Try again", "5"], ["Cold", "10"], ["if age > 18:", "if age = 18:"]], [["False", "7"], ["False", "Error"], ["True", "8"], ["False", "12"]], [["2", "4"], ["4", "6"], ["4", "0"], ["1\n2", "0\n1\n2"]], [["saw", "tools"], ["red", "blue"], ["2", "30"], ["tools = \"wrench\"", "tools.append(wrench)"]], [["6", "36"], ["10", "12"], ["function greet():", "def greet:"], ["23", "6"]], [["print(nmae)", "print(\"name\")"], ["TypeError", "SyntaxError"], ["print(\"Hello\"", "print(Hello)"], ["Name", "NAME"]], [["w", "a"], ["r", "a"], ["notes = file.read", "notes = read(file)"], ["if", "for"]], [["12.520", "20"], ["815", "7"], ["4.51", "5"], ["total = materials * labour", "total == materials + labour"]]];

   const timeout=(ms,message)=>{clearTimeout(practiceTimer);practiceTimer=setTimeout(()=>{stopPractice(message);runStatus.textContent='Stopped. You can edit your code and try again.';},ms);};
   timeout(90000,'Python could not load in time. Check your internet connection and try again.');
   practiceWorker.onmessage=e=>{if(e.data.type==='ready'){runStatus.textContent='Running your code…';timeout(15000,'Stopped after 15 seconds. Check for an endless loop.');return;}output.textContent=e.data.text;runStatus.textContent=e.data.type==='error'?'Python reported an error. Read the output and try a change.':'Finished.';stopPractice();};
   practiceWorker.onerror=()=>{stopPractice('Could not load or run Python. Check your connection. If opening a downloaded file fails, try the app through GitHub Pages.');runStatus.textContent='Could not run code.';};

}

function normalizeCode(value){const tokens=value.match(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|[A-Za-z_]\w*|\d+(?:\.\d+)?|>=|<=|==|!=|[^\s]/g)||[];return JSON.stringify(tokens.map(t=>/^['"]/.test(t)?'STRING:'+t.slice(1,-1):t));}
function lesson(i,j){recordScreen({type:'lesson',i,j});$('lessonSelect').value=`${i}-${j}`;state.last={section:i,lesson:j};save();const item=sections[i].lessons[j],card=el('article',undefined,'card');card.append(el('p',`${sections[i].title} · Lesson ${j+1} of ${sections[i].lessons.length}`,'muted'),el('h2',item.title),lessonNavigation(i,j),el('p',item.explain),el('h3','Example'),el('pre',item.code),el('h3','What it produces'),el('pre',item.output));const details=el('details');details.append(el('summary','How to practise this code'),el('p','Copy or type the example into a .py file in VS Code and run it with Python installed. Use the practice editor below to run the example, or try it in VS Code. Choose an answer for each of the four multiple-choice exercises to check your understanding separately.'));card.append(details,practicePanel(item,i,j),el('h3','How to work through this lesson'),el('p','1. Read the explanation. 2. Look at the example and its output. 3. Try all four exercises. Use a hint when needed, and check each answer. Then mark the lesson complete.','muted'),el('h3','Four practice exercises'));
item.exercises.forEach((exercise,n)=>{
 const block=el('fieldset',undefined,'exercise-panel');block.append(el('legend',`Exercise ${n+1} of ${item.exercises.length}`));
 const prompt=el('p',exercise.task.replace('Enter string or integer.','Choose the correct type.').replace('Put each number on its own line.','Choose the output.').replace('Enter with or if.','Choose the correct statement.'));prompt.style.whiteSpace='pre-wrap';block.append(prompt);
 const radios=[];
 exercise.choices.forEach((choice,k)=>{const label=el('label'),radio=el('input');radio.type='radio';radio.name=`exercise-${i}-${j}-${n}`;radio.value=String(k);label.style.whiteSpace='pre-wrap';label.append(radio,document.createTextNode(choice));block.append(label);radios.push(radio);});
 const feedback=el('p',undefined,'feedback');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
 const actions=el('div',undefined,'actions');
 const check=btn('Check answer',()=>{const selected=radios.find(r=>r.checked);if(!selected){feedback.textContent='Choose an answer first, then press Check answer.';return;}const correct=exercise.choices[Number(selected.value)]===exercise.answer;check.classList.toggle('correct',correct);check.textContent=correct?'✓ Correct':'Check answer';feedback.textContent=correct?`Correct! ${exercise.explanation}`:'Not quite. Try the hint, then check again.';});check.className='check-answer';radios.forEach(r=>r.onchange=()=>{check.classList.remove('correct');check.textContent='Check answer';feedback.textContent='';});actions.append(check,btn('Hint',()=>feedback.textContent=exercise.hint,true),btn('Show answer',()=>feedback.textContent=`Answer: ${exercise.answer} — ${exercise.explanation}`,true));
 block.append(actions,feedback);card.append(block);
});
const nav=el('div',undefined,'actions');nav.append(btn(state.done.includes(`${i}-${j}`)?'Completed — continue':'Mark complete & continue',()=>{if(!state.done.includes(`${i}-${j}`))state.done.push(`${i}-${j}`);save();j+1<sections[i].lessons.length?lesson(i,j+1):quiz(i);}),btn('Back',()=>j>0?lesson(i,j-1):home(),true));card.append(nav);display(card);}
function quiz(i){recordScreen({type:'quiz',i});$('lessonSelect').value='';const card=el('article',undefined,'card');card.append(el('h2',`${sections[i].title}: quiz`),el('p','Answer all three questions. Get at least two correct to pass. You can retake this quiz as often as you like.'));const form=el('form');sections[i].quiz.forEach((q,n)=>{const field=el('fieldset');field.append(el('legend',`${n+1}. ${q[0]}`));q[1].forEach((answer,a)=>{const label=el('label'),radio=el('input');radio.type='radio';radio.name=`q${n}`;radio.value=String(a);radio.required=true;label.append(radio,document.createTextNode(answer));field.append(label);});form.append(field);});const submit=el('button','Mark my quiz');submit.type='submit';form.append(submit);const results=el('div');results.setAttribute('role','status');results.setAttribute('aria-live','polite');form.onsubmit=e=>{e.preventDefault();results.replaceChildren();const data=new FormData(form);let correct=0;sections[i].quiz.forEach((q,n)=>{const chosen=Number(data.get(`q${n}`)),right=chosen===q[2];if(right)correct++;results.append(el('p',`${n+1}. ${right?'Correct.':'Review: '+q[1][q[2]]+'.'} ${q[3]}`,'feedback'));});const score=Math.round(correct/3*100);state.best[i]=Math.max(state.best[i]||0,score);if(correct>=2&&!state.passed.includes(i))state.passed.push(i);save();results.prepend(el('h3',`${correct}/3 correct (${score}%) — ${correct>=2?'Passed!':'Keep practising.'}`));const actions=el('div',undefined,'actions');actions.append(btn('Retake quiz',()=>quiz(i),true),btn('Review lessons',()=>lesson(i,0),true));actions.append(btn(i+1<sections.length?'Next section':'Back to learning path',()=>i+1<sections.length?lesson(i+1,0):home()));results.append(actions);};card.append(form,results);display(card);}
sections.forEach((section,i)=>{const group=el('optgroup');group.label=section.title+' — 0 of 6 lessons complete';section.lessons.forEach((item,j)=>{const option=el('option',`Lesson ${j+1}: ${item.title}`);option.value=`${i}-${j}`;group.append(option);});$('lessonSelect').append(group);});$('lessonSelect').onchange=()=>{const value=$('lessonSelect').value;if(value){const [i,j]=value.split('-').map(Number);lesson(i,j);}};

function lessonNavigation(i,j){const nav=el('div',undefined,'lesson-navigation');const previous=btn('‹ Previous',()=>{if(j>0)lesson(i,j-1);else if(i>0)lesson(i-1,sections[i-1].lessons.length-1);else home();},true);const next=btn('Next ›',()=>j+1<sections[i].lessons.length?lesson(i,j+1):quiz(i));nav.append(previous,next);return nav;}
function buildTopics(){const nav=$('topics');const overview=btn('Course overview',home,true);overview.className='topic';overview.dataset.screen='home';nav.append(overview);sections.forEach((section,i)=>{const group=el('details');group.open=i===state.last.section;group.append(el('summary',section.title));section.lessons.forEach((item,j)=>{const b=btn(item.title,()=>lesson(i,j));b.className='topic';b.dataset.screen=`${i}-${j}`;b.dataset.title=item.title;group.append(b);});const q=btn('Section quiz',()=>quiz(i));q.className='topic';q.dataset.screen=`quiz-${i}`;group.append(q);nav.append(group);});}
const colourKey='python-step-by-step-colour';try{const savedColour=localStorage.getItem(colourKey);if(['green','blue','purple','grey'].includes(savedColour))$('screenColour').value=savedColour;}catch{}function applyColour(){document.body.dataset.colour=$('screenColour').value;try{localStorage.setItem(colourKey,$('screenColour').value);}catch{}}$('screenColour').onchange=applyColour;applyColour();buildTopics();$('back').onclick=goBack;$('theme').onclick=()=>{state.dark=!state.dark;save();};$('continue').onclick=()=>lesson(state.last.section,state.last.lesson);$('reset').onclick=()=>{if(confirm('Reset all lesson completions and quiz scores on this browser?')){state={done:[],passed:[],best:{},last:{section:0,lesson:0},dark:state.dark};save();home();}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='Python_Study_Progress.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);};$('import').onchange=async()=>{const file=$('import').files[0];if(!file)return;try{if(file.size>100000)throw Error('File too large');const raw=JSON.parse(await file.text()),next=cleanState(raw);if(confirm('Replace this browser’s progress with the backup?')){state=next;save();home();$('notice').textContent='Progress restored.';}}catch{$('notice').textContent='Could not restore that file. Choose a Python Study progress backup.';}finally{$('import').value='';}};update();home();
